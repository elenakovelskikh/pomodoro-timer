# Publishes the site, the Discord Activity and Storybook to GitHub Pages on every push to main:
#   /            the site (the repo's tracked files, without storybook/ and .github/)
#   /discord/    the Discord Activity; its links to shared files (../shared, ../design-tokens.js,
#                ../vendor/…) become real copies, since Discord's proxy only serves that folder
#   /discord-retro/  the Retro Activity (its own Discord app), built the same way as /discord/
#   /storybook/  the built Storybook
#   /storybook-retro/  the Retro Storybook: the components only the retro timers use
# Needs Settings → Pages → Source set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push waits instead of cancelling a deploy in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storybook/package-lock.json

      - name: Copy the site
        run: |
          mkdir _site
          git ls-files | grep -v -e '^storybook/' -e '^\.github/' | xargs -I{} cp -L --parents {} _site/

      # Discord only runs inline scripts that its proxy marks with a nonce; a script loaded with
      # src= and executed by Babel is blocked there. So each Activity gets shared/ui.jsx written
      # into its page instead of linked (the site keeps the link).
      - name: Inline the shared UI code into the Discord Activities
        run: |
          python3 - <<'EOF'
          tag = '<script type="text/babel" src="shared/ui.jsx"></script>'
          code = open("shared/ui.jsx", encoding="utf-8").read()
          assert "</script" not in code
          for page in ["_site/discord/index.html", "_site/discord-retro/index.html"]:
              html = open(page, encoding="utf-8").read()
              assert html.count(tag) == 1, page
              open(page, "w", encoding="utf-8").write(html.replace(tag, '<script type="text/babel">\n' + code + '</script>'))
          EOF

      # The Activities' Discord app ID and Firebase settings aren't in the repository (Discord's
      # Developer Terms don't allow app IDs in open-source code); they're kept in repository
      # variables (Settings → Secrets and variables → Actions → Variables) and written next to each
      # Activity page here. The deploy stops if one is missing or isn't valid JSON.
      - name: Write the Activities' config.js
        env:
          TIMER_ACTIVITY_CONFIG: ${{ vars.TIMER_ACTIVITY_CONFIG }}
          RETRO_ACTIVITY_CONFIG: ${{ vars.RETRO_ACTIVITY_CONFIG }}
        run: |
          python3 - <<'EOF'
          import json, os
          for var, folder in [("TIMER_ACTIVITY_CONFIG", "discord"), ("RETRO_ACTIVITY_CONFIG", "discord-retro")]:
              config = json.loads(os.environ[var] or "null")
              assert config and config.get("DISCORD_CLIENT_ID") and config.get("FIREBASE_CONFIG"), f"repository variable {var} is missing or incomplete"
              open(f"_site/{folder}/config.js", "w", encoding="utf-8").write("window.ACTIVITY_CONFIG = " + json.dumps(config) + ";\n")
          EOF

      - name: Build the Storybooks
        working-directory: storybook
        run: |
          npm ci
          npx storybook build -o ../_site/storybook --quiet
          npx storybook build -c .storybook-retro -o ../_site/storybook-retro --quiet

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
