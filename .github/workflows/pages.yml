# Publishes the site, the Discord Activity and Storybook to GitHub Pages on every push to main:
#   /            the site (the repo's tracked files, without storybook/ and .github/)
#   /discord/    the Discord Activity; its links to shared files (../shared, ../design-tokens.js,
#                ../vendor/…) become real copies, since Discord's proxy only serves that folder
#   /storybook/  the built Storybook
# Needs Settings → Pages → Source set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push waits instead of cancelling a deploy in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storybook/package-lock.json

      - name: Copy the site
        run: |
          mkdir _site
          git ls-files | grep -v -e '^storybook/' -e '^\.github/' | xargs -I{} cp -L --parents {} _site/

      # Discord only runs inline scripts that its proxy marks with a nonce; a script loaded with
      # src= and executed by Babel is blocked there. So the Activity gets shared/ui.jsx written
      # into its page instead of linked (the site keeps the link).
      - name: Inline the shared UI code into the Discord Activity
        run: |
          python3 - <<'EOF'
          page = "_site/discord/index.html"
          tag = '<script type="text/babel" src="shared/ui.jsx"></script>'
          html = open(page, encoding="utf-8").read()
          code = open("shared/ui.jsx", encoding="utf-8").read()
          assert html.count(tag) == 1 and "</script" not in code
          open(page, "w", encoding="utf-8").write(html.replace(tag, '<script type="text/babel">\n' + code + '</script>'))
          EOF

      - name: Build Storybook
        working-directory: storybook
        run: |
          npm ci
          npx storybook build -o ../_site/storybook --quiet

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
