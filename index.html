<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useId } = React;

const FOCUS_MIN = 25;
const BREAK_MIN = 5;
const LONG_BREAK_MIN = 30;
const CYCLES_BEFORE_LONG_BREAK = 4;

// null = no long break at all — every 4th round just gets the regular short break instead
const LONG_BREAK_OPTIONS = [
  { value: 15, label: "15 min" },
  { value: 30, label: "30 min" },
  { value: null, label: "None" },
];

const START_WITH_OPTIONS = [
  { value: true, label: "Break" },
  { value: false, label: "Focus" },
];

const COMPLETION_HEADINGS = ["Great job!", "Nice work!", "You crushed it!", "Well done!", "Way to go!", "Amazing focus!"];

const { MODE_COLORS } = window.DESIGN_TOKENS;

const MODES = {
  focus: { label: "Focus", minutes: FOCUS_MIN, ...MODE_COLORS.focus, emoji: ["📚", "💻", "✍️"] },
  break: { label: "Break", minutes: BREAK_MIN, ...MODE_COLORS.break, emoji: "☕" },
  longBreak: { label: "Long break", minutes: LONG_BREAK_MIN, ...MODE_COLORS.longBreak, emoji: "🌴" },
};

function formatTime(s) {
  const m = Math.floor(s / 60).toString().padStart(2, "0");
  const sec = (s % 60).toString().padStart(2, "0");
  return `${m}:${sec}`;
}

function formatClock(date) {
  const h = date.getHours().toString().padStart(2, "0");
  const m = date.getMinutes().toString().padStart(2, "0");
  return `${h}:${m}`;
}

const N = { G4:392.00, A4:440.00, C5:523.25, D5:587.33, E5:659.25, G5:783.99, A5:880.00, C6:1046.50, D6:1174.66, E6:1318.51, G6:1567.98 };

function playNotes(notes) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const now = ctx.currentTime;
  let maxEnd = 0;
  notes.forEach(({ freq, start, dur, gain = 0.22, type = "sine" }) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t0 = now + start;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur);
    maxEnd = Math.max(maxEnd, start + dur);
  });
  setTimeout(() => ctx.close(), (maxEnd + 0.3) * 1000);
}

const FANFARE_EXTENDED = [
  { freq: N.G4, start: 0,    dur: 0.2 },
  { freq: N.C5, start: 0.15, dur: 0.2 },
  { freq: N.E5, start: 0.30, dur: 0.2 },
  { freq: N.G5, start: 0.45, dur: 0.2 },
  { freq: N.C6, start: 0.60, dur: 0.2 },
  { freq: N.E6, start: 0.75, dur: 0.2 },
  { freq: N.G6, start: 0.90, dur: 0.25 },
  { freq: N.C6, start: 1.10, dur: 0.8 },
];

const PENTATONIC_CLIMB = [
  { freq: N.C5, start: 0,    dur: 0.22 },
  { freq: N.D5, start: 0.16, dur: 0.22 },
  { freq: N.E5, start: 0.32, dur: 0.22 },
  { freq: N.G5, start: 0.48, dur: 0.22 },
  { freq: N.A5, start: 0.64, dur: 0.22 },
  { freq: N.C6, start: 0.80, dur: 0.6 },
];

function playSound(kind) {
  // kind: "focusEnd" — a focus round just finished, "breakEnd" — a break just finished
  playNotes(kind === "focusEnd" ? FANFARE_EXTENDED : PENTATONIC_CLIMB);
}

// how long each melody actually plays, used to hold off starting the next round
const SOUND_DURATION_MS = { focusEnd: 1900, breakEnd: 1400 };

// size is given in px at the default 16px root font size and rendered in rem, so icons scale with text
function Icon({ children, size = 18, className, style }) {
  return (
    <svg
      viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
      aria-hidden="true" focusable="false"
      className={className}
      style={{ width: `${size / 16}rem`, height: `${size / 16}rem`, ...style }}
    >
      {children}
    </svg>
  );
}
const PlayIcon = (props) => <Icon {...props}><polygon points="6 3 20 12 6 21 6 3" /></Icon>;
const PauseIcon = (props) => <Icon {...props}><rect x="14" y="4" width="4" height="16" rx="1" /><rect x="6" y="4" width="4" height="16" rx="1" /></Icon>;
const RotateCcwIcon = (props) => <Icon {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></Icon>;
const SkipForwardIcon = (props) => <Icon {...props}><polygon points="5 4 15 12 5 20 5 4" /><line x1="19" x2="19" y1="5" y2="19" /></Icon>;
const ChevronDownIcon = (props) => <Icon {...props}><path d="m6 9 6 6 6-6" /></Icon>;
const ChevronUpIcon = (props) => <Icon {...props}><path d="m18 15-6-6-6 6" /></Icon>;
const MinusIcon = (props) => <Icon {...props}><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
const PlusIcon = (props) => <Icon {...props}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;

// A proper ARIA radiogroup: one tab stop for the whole group (only the checked option is in the
// tab order), Left/Up and Right/Down move the checked option and keyboard focus together.
// The keyboard focus ring is the same as on every other button (see the <style> block).
function RadioGroup({ label, options, value, onChange }) {
  function handleKeyDown(e) {
    const dir = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
    if (!dir) return;
    e.preventDefault();
    const idx = options.findIndex((o) => o.value === value);
    const nextIdx = (idx + dir + options.length) % options.length;
    onChange(options[nextIdx].value);
    e.currentTarget.querySelectorAll('[role="radio"]')[nextIdx]?.focus();
  }

  return (
    <div className="w-full flex flex-col items-start gap-2">
      <div className="type-control text-label">{label}</div>
      <div role="radiogroup" aria-label={label} onKeyDown={handleKeyDown} className="flex flex-wrap gap-2">
        {options.map((opt) => {
          const selected = value === opt.value;
          return (
            <button
              key={String(opt.value)}
              type="button"
              role="radio"
              aria-checked={selected}
              tabIndex={selected ? 0 : -1}
              onClick={() => onChange(opt.value)}
              className={`px-6 py-3 rounded-xl type-control whitespace-nowrap ${
                selected
                  ? "ring-2 ring-inset ring-radio-selected bg-radio-selected text-radio-selected"
                  : "ring-1 ring-inset ring-radio hover:ring-radio-hover text-button-tertiary hover:text-button-tertiary-hover"
              }`}
            >
              {opt.label}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function HistoryLog({ history }) {
  return (
    <div className="flex flex-col items-start gap-0.5 mt-4 text-left">
      {history.map((entry, i) => {
        const label = entry.type === "focus" ? "focus" : entry.type === "break" ? "break" : "long break";
        return (
          <div key={i} className="flex type-caption text-secondary">
            <span className="inline-block w-20">{label}</span>
            <span className="font-mono">
              {formatClock(entry.start)} – {formatClock(entry.end)}
            </span>
          </div>
        );
      })}
    </div>
  );
}

// The links are 24px tall (WCAG 2.5.8 minimum target size) even though the text is 10px;
// the row's padding is trimmed to match, so the footer keeps its height.
function Credit({ inert }) {
  const link = "inline-flex items-center min-h-6 hover:text-label underline";
  return (
    <footer
      inert={inert ? "" : undefined}
      className="w-full flex items-center justify-center gap-1 py-[0.6875rem] type-credit text-muted"
    >
      <span>Made by Elena Kovelskikh</span>
      <span aria-hidden="true">·</span>
      <a href="https://www.linkedin.com/in/kovelskikh/" target="_blank" rel="noopener noreferrer" className={link}>
        LinkedIn<span className="sr-only"> (opens in a new tab)</span>
      </a>
      <span aria-hidden="true">·</span>
      <a href="https://github.com/elenakovelskikh" target="_blank" rel="noopener noreferrer" className={link}>
        GitHub<span className="sr-only"> (opens in a new tab)</span>
      </a>
    </footer>
  );
}

// Rounds picker: − / value / +. value is a number of rounds or null for "no limit" (∞).
// The buttons use aria-disabled instead of disabled at the ends of the range, so keyboard focus
// stays on them instead of being dropped when the limit is reached. The value is a polite live
// region, so screen readers announce it after each press.
function RoundsStepper({ label, value, onChange }) {
  const labelId = useId();
  const atMin = value === null;
  const atMax = value === 16;
  const step =
    "w-11 h-11 flex items-center justify-center bg-button-secondary text-button-secondary hover:text-button-secondary-hover hover:bg-button-secondary-hover aria-disabled:opacity-40 aria-disabled:cursor-not-allowed aria-disabled:hover:bg-button-secondary aria-disabled:hover:text-button-secondary";
  return (
    <div role="group" aria-labelledby={labelId} className="w-full flex flex-col items-start gap-2">
      <div id={labelId} className="type-control text-label">{label}</div>
      <div className="flex items-stretch rounded-xl border border-subtle">
        <button
          type="button"
          aria-label="Fewer rounds"
          aria-disabled={atMin || undefined}
          onClick={() => !atMin && onChange(value === 1 ? null : value - 1)}
          className={`${step} rounded-l-xl`}
        >
          <MinusIcon size={20} />
        </button>
        <span className="w-24 flex items-center justify-center border-x border-subtle" aria-live="polite" aria-atomic="true">
          <span className="flex items-baseline gap-1.5 tabular-nums">
            {atMin ? (
              <>
                <span className="type-heading text-primary" aria-hidden="true">∞</span>
                <span className="sr-only">No limit</span>
              </>
            ) : (
              <>
                <span className="type-heading text-primary">{value}</span>
                <span className="type-body text-primary">{value === 1 ? "round" : "rounds"}</span>
              </>
            )}
          </span>
        </span>
        <button
          type="button"
          aria-label="More rounds"
          aria-disabled={atMax || undefined}
          onClick={() => !atMax && onChange(atMin ? 1 : value + 1)}
          className={`${step} rounded-r-xl`}
        >
          <PlusIcon size={20} />
        </button>
      </div>
    </div>
  );
}

// Popup over the page: a modal dialog named by its title. Focus moves into it when it opens and
// goes back to whatever had it before when it closes; Escape closes it if onClose is given.
// The page behind it is made inert by the caller, so Tab can't leave the dialog.
function Dialog({ title, description, children, onClose }) {
  const titleId = useId();
  const ref = useRef(null);
  useEffect(() => {
    const previous = document.activeElement;
    ref.current?.focus();
    return () => previous?.focus?.();
  }, []);
  return (
    <div
      className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-overlay"
      onKeyDown={onClose ? (e) => e.key === "Escape" && onClose() : undefined}
    >
      <div
        ref={ref}
        role="dialog"
        aria-modal="true"
        aria-labelledby={titleId}
        tabIndex={-1}
        className="w-full max-w-sm bg-page rounded-2xl border border-subtle shadow-xl p-6 flex flex-col items-center gap-6 focus:outline-none"
      >
        <div className="w-full text-left">
          <h2 id={titleId} className="type-heading text-primary">{title}</h2>
          {description && <p className="type-body text-secondary mt-3">{description}</p>}
        </div>
        {children}
      </div>
    </div>
  );
}

function PomodoroTimer() {
  const [mode, setMode] = useState("focus");
  const [secondsLeft, setSecondsLeft] = useState(FOCUS_MIN * 60);
  const [segmentTotal, setSegmentTotal] = useState(FOCUS_MIN * 60);
  const [isRunning, setIsRunning] = useState(false);
  const [completedCycles, setCompletedCycles] = useState(0);
  const [history, setHistory] = useState([]);
  const [logOpen, setLogOpen] = useState(false);
  const [summaryLogOpen, setSummaryLogOpen] = useState(false);
  const [isTransitioning, setIsTransitioning] = useState(false);
  const [preTransitionLabel, setPreTransitionLabel] = useState("Pause");
  const [longBreakMinutes, setLongBreakMinutes] = useState(30);
  const [roundsLimit, setRoundsLimit] = useState(null); // null = unlimited (default), number = limit
  const [setupComplete, setSetupComplete] = useState(false);
  const [sessionComplete, setSessionComplete] = useState(false);
  const [completionHeading, setCompletionHeading] = useState("Great job!");
  const [addRoundsModalOpen, setAddRoundsModalOpen] = useState(false);
  const [addRoundsAmount, setAddRoundsAmount] = useState(4);
  const [addStartsWithBreak, setAddStartsWithBreak] = useState(true);
  const [originalRoundsChoice, setOriginalRoundsChoice] = useState(null);
  const intervalRef = useRef(null);
  const playPauseRef = useRef(null);
  const completionHeadingRef = useRef(null);
  const segmentStartRef = useRef(null);
  // How long the current segment has spent paused so far, plus when the current pause began
  // (if any) — segmentStartRef must stay the true wall-clock start for the session log, so the
  // real-time countdown recompute below subtracts this out instead.
  const pausedMsRef = useRef(0);
  const pauseStartedAtRef = useRef(null);

  const totalSeconds = segmentTotal;
  const progress = 1 - secondsLeft / totalSeconds;

  const logSegment = useCallback(
    (endedMode, startTime, endTime) => {
      if (endedMode === "focus") {
        const newCompleted = completedCycles + 1;
        setCompletedCycles(newCompleted);
        setHistory((h) => [...h, { type: "focus", round: newCompleted, start: startTime, end: endTime }]);
      } else {
        setHistory((h) => [
          ...h,
          { type: endedMode === "longBreak" ? "longBreak" : "break", round: completedCycles, start: startTime, end: endTime },
        ]);
      }
    },
    [completedCycles]
  );

  // automatic: timer hit zero — play the sound, show the transition animation,
  // and only start the next round once the sound has actually finished
  const handleAutoComplete = useCallback((labelOverride) => {
    const endTime = new Date();
    const startTime = segmentStartRef.current || endTime;
    const endedMode = mode;
    const soundKind = endedMode === "focus" ? "focusEnd" : "breakEnd";
    const newCompletedIfFocus = completedCycles + 1;

    setPreTransitionLabel(labelOverride ?? "Pause");
    playSound(soundKind);
    setIsRunning(false);
    setIsTransitioning(true);
    logSegment(endedMode, startTime, endTime);
    const isLastRound = endedMode === "focus" && roundsLimit && newCompletedIfFocus >= roundsLimit;

    setTimeout(() => {
      if (isLastRound) {
        // the last permitted focus is done — end the session right away, no trailing break
        setIsTransitioning(false);
        setCompletionHeading(COMPLETION_HEADINGS[Math.floor(Math.random() * COMPLETION_HEADINGS.length)]);
        setSessionComplete(true);
      } else if (endedMode === "focus") {
        const isLongBreak = newCompletedIfFocus % CYCLES_BEFORE_LONG_BREAK === 0 && longBreakMinutes !== null;
        const nextTotal = (isLongBreak ? longBreakMinutes : BREAK_MIN) * 60;
        setMode(isLongBreak ? "longBreak" : "break");
        setSecondsLeft(nextTotal);
        setSegmentTotal(nextTotal);
        segmentStartRef.current = new Date();
        pausedMsRef.current = 0;
        pauseStartedAtRef.current = null;
        setIsRunning(true);
        setIsTransitioning(false);
      } else {
        setMode("focus");
        setSecondsLeft(FOCUS_MIN * 60);
        setSegmentTotal(FOCUS_MIN * 60);
        segmentStartRef.current = new Date();
        pausedMsRef.current = 0;
        pauseStartedAtRef.current = null;
        setIsRunning(true);
        setIsTransitioning(false);
      }
    }, SOUND_DURATION_MS[soundKind]);
  }, [mode, logSegment, completedCycles, longBreakMinutes, roundsLimit]);

  // lets the group cut a 30-min long break short and drop into a fresh 5-min break instead
  function switchToShortBreak() {
    const endTime = new Date();
    const startTime = segmentStartRef.current || endTime;
    const label = isRunning ? "Pause" : secondsLeft === totalSeconds ? "Start" : "Resume";

    setPreTransitionLabel(label);
    playSound("breakEnd");
    setIsRunning(false);
    setIsTransitioning(true);
    logSegment("longBreak", startTime, endTime);

    setTimeout(() => {
      setMode("break");
      setSecondsLeft(BREAK_MIN * 60);
      setSegmentTotal(BREAK_MIN * 60);
      segmentStartRef.current = new Date();
      pausedMsRef.current = 0;
      pauseStartedAtRef.current = null;
      setIsRunning(true);
      setIsTransitioning(false);
    }, SOUND_DURATION_MS.breakEnd);
  }

  // mins lets a one-off long break be started even when the auto-cycle's long break is set to
  // "None" — it doesn't touch the longBreakMinutes setting, so the 4th-round rule stays as configured
  function startLongBreak(mins) {
    // falls back to 30 min when "Long break length" is set to None, so the manual button always works
    const durationMinutes = mins ?? longBreakMinutes ?? 30;
    const endTime = new Date();
    const startTime = segmentStartRef.current || endTime;
    const endedMode = mode;
    const soundKind = endedMode === "focus" ? "focusEnd" : "breakEnd";
    const label = isRunning ? "Pause" : secondsLeft === totalSeconds ? "Start" : "Resume";

    setPreTransitionLabel(label);
    playSound(soundKind);
    setIsRunning(false);
    setIsTransitioning(true);
    logSegment(endedMode, startTime, endTime);

    setTimeout(() => {
      setMode("longBreak");
      setSecondsLeft(durationMinutes * 60);
      setSegmentTotal(durationMinutes * 60);
      segmentStartRef.current = new Date();
      pausedMsRef.current = 0;
      pauseStartedAtRef.current = null;
      setIsRunning(true);
      setIsTransitioning(false);
    }, SOUND_DURATION_MS[soundKind]);
  }

  // lets the group top up the current long break by 5 more minutes — extend the total too,
  // so the progress ring reflects the new, longer duration instead of appearing to jump backwards
  function addFiveMinutes() {
    setSecondsLeft((s) => s + 5 * 60);
    setSegmentTotal((t) => t + 5 * 60);
  }

  // Recompute from the real start time (rather than just decrementing by 1 each tick) so a
  // throttled or fully paused background tab still lands on the correct remaining time —
  // and completes the round immediately — the moment the phone/tab is looked at again.
  const syncSecondsLeft = useCallback(() => {
    const start = segmentStartRef.current;
    if (!start) return;
    // still paused right now? count up to this instant instead of leaving a stale pause length
    const pausedMs = pausedMsRef.current + (pauseStartedAtRef.current ? Date.now() - pauseStartedAtRef.current : 0);
    const elapsed = Math.floor((Date.now() - start.getTime() - pausedMs) / 1000);
    const remaining = Math.max(0, segmentTotal - elapsed);
    setSecondsLeft(remaining);
    if (remaining <= 0) handleAutoComplete();
  }, [segmentTotal, handleAutoComplete]);

  useEffect(() => {
    if (isRunning) {
      intervalRef.current = setInterval(syncSecondsLeft, 1000);
    } else {
      clearInterval(intervalRef.current);
    }
    return () => clearInterval(intervalRef.current);
  }, [isRunning, syncSecondsLeft]);

  // Mobile browsers pause/throttle JS timers while the tab is hidden (backgrounded, screen
  // locked, another app in front) — there's no way for a web page to keep the countdown
  // ticking through that, but re-checking the real elapsed time the instant the tab becomes
  // visible again means it snaps to the correct value (or completes the round) right away
  // instead of showing a stale number.
  useEffect(() => {
    const onVisible = () => {
      if (!document.hidden && isRunning) syncSecondsLeft();
    };
    document.addEventListener("visibilitychange", onVisible);
    return () => document.removeEventListener("visibilitychange", onVisible);
  }, [isRunning, syncSecondsLeft]);

  // Screen Wake Lock: keeps the screen from auto-dimming/locking while a round is running and
  // the tab is in view. Released automatically by the browser once the tab is hidden, and
  // there's no API to keep a background tab's screen awake or to override the phone's own
  // lock button — so this only helps while the timer is actually on screen.
  useEffect(() => {
    if (!("wakeLock" in navigator)) return;
    let wakeLock = null;
    async function acquire() {
      try {
        wakeLock = await navigator.wakeLock.request("screen");
      } catch (err) {
        // often rejects on low battery / when the tab isn't visible — not worth surfacing
      }
    }
    async function onVisible() {
      if (isRunning && !document.hidden && !wakeLock) await acquire();
    }
    if (isRunning) acquire();
    document.addEventListener("visibilitychange", onVisible);
    return () => {
      document.removeEventListener("visibilitychange", onVisible);
      if (wakeLock) wakeLock.release().catch(() => {});
    };
  }, [isRunning]);

  useEffect(() => {
    document.title = isRunning
      ? `${formatTime(secondsLeft)} — ${MODES[mode].label}`
      : "Violet Tomato – Automatic Pomodoro Focus Timer";
  }, [secondsLeft, mode, isRunning]);

  // Lock background scroll while a popup covers the screen — otherwise the page behind it can
  // still be scrolled (e.g. by touch drag), even though it's inert and visually dimmed.
  useEffect(() => {
    const modalOpen = !setupComplete || addRoundsModalOpen;
    document.documentElement.style.overflow = modalOpen ? "hidden" : "";
    document.body.style.overflow = modalOpen ? "hidden" : "";
    return () => {
      document.documentElement.style.overflow = "";
      document.body.style.overflow = "";
    };
  }, [setupComplete, addRoundsModalOpen]);

  // Keyboard focus when the screen changes underneath it: the timer screen (after Start or after
  // adding rounds) puts focus on Play/Pause, the completion screen on its heading.
  const timerScreen = setupComplete && !sessionComplete;
  useEffect(() => {
    if (timerScreen) playPauseRef.current?.focus();
  }, [timerScreen]);
  useEffect(() => {
    if (sessionComplete) completionHeadingRef.current?.focus();
  }, [sessionComplete]);

  function startSession() {
    setSetupComplete(true);
    setOriginalRoundsChoice(roundsLimit);
    setMode("focus");
    setSecondsLeft(FOCUS_MIN * 60);
    setSegmentTotal(FOCUS_MIN * 60);
    segmentStartRef.current = new Date();
    pausedMsRef.current = 0;
    pauseStartedAtRef.current = null;
    setIsRunning(true);
  }

  function confirmAddRounds() {
    setRoundsLimit(addRoundsAmount === null ? null : (r) => (r ?? 0) + addRoundsAmount);
    setAddRoundsModalOpen(false);
    setSessionComplete(false);
    let nextMode = "focus";
    if (addStartsWithBreak) {
      nextMode = completedCycles % CYCLES_BEFORE_LONG_BREAK === 0 && longBreakMinutes !== null ? "longBreak" : "break";
    }
    const nextTotal = (nextMode === "longBreak" ? longBreakMinutes : MODES[nextMode].minutes) * 60;
    setMode(nextMode);
    setSecondsLeft(nextTotal);
    setSegmentTotal(nextTotal);
    segmentStartRef.current = new Date();
    pausedMsRef.current = 0;
    pauseStartedAtRef.current = null;
    setIsRunning(true);
  }

  function handlePlayPause() {
    setIsRunning((r) => {
      const newRunning = !r;
      if (newRunning) {
        if (!segmentStartRef.current) {
          segmentStartRef.current = new Date();
          pausedMsRef.current = 0;
          pauseStartedAtRef.current = null;
        } else if (pauseStartedAtRef.current) {
          // resuming: fold the just-finished pause into the running total so the real-time
          // recompute doesn't count it as elapsed segment time
          pausedMsRef.current += Date.now() - pauseStartedAtRef.current;
          pauseStartedAtRef.current = null;
        }
      } else {
        pauseStartedAtRef.current = Date.now();
      }
      return newRunning;
    });
  }

  function handleReset() {
    // a manually started long break runs 30 min when "Long break length" is None (see
    // startLongBreak) — restart it at that length too, rather than at zero
    const baseTotal = (mode === "longBreak" ? longBreakMinutes ?? LONG_BREAK_MIN : MODES[mode].minutes) * 60;
    setSecondsLeft(baseTotal);
    setSegmentTotal(baseTotal);
    segmentStartRef.current = new Date();
    pausedMsRef.current = 0;
    pauseStartedAtRef.current = null;
    setIsRunning(true);
  }

  function handleSkip() {
    // reuse the same sound + transition-delay flow as auto-complete, so it's easy to test
    const label = isRunning ? "Pause" : secondsLeft === totalSeconds ? "Start" : "Resume";
    handleAutoComplete(label);
  }

  const accent = MODES[mode].accent;
  const shadowColor = MODES[mode].shadow;
  const arcColor = MODES[mode].arc;
  const radius = 120;
  const circumference = 2 * Math.PI * radius;
  // The colored arc is the time remaining: it starts full at 12 o'clock and its moving end
  // retreats counter-clockwise as the segment runs.
  const dashoffset = circumference * progress;
  const tipDeg = (1 - progress) * 360;
  // Soft round shadow cast by the moving end onto whatever lies just clockwise of it — the gray
  // track mid-segment, or the fixed end of the arc itself right at the start. It's a blurred disc
  // nudged ahead of the cap, so the part peeking out from under the cap is crescent-shaped.
  const shadowDeg = 1.5;
  const shadowCenter = {
    x: 140 + radius * Math.cos((shadowDeg * Math.PI) / 180),
    y: 140 + radius * Math.sin((shadowDeg * Math.PI) / 180),
  };

  const centerLabel = mode === "focus" ? `Round ${completedCycles + 1}` : "";
  const completeText = mode === "focus" ? "Focus round complete" : mode === "break" ? "Break complete" : "Long break complete";
  const roundsText = completedCycles === 1 ? "You completed 1 round" : `You completed all ${completedCycles} rounds`;

  // Read out by screen readers whenever it changes: round starts, round ends, session end.
  // It doesn't include the time, so it stays quiet while the clock ticks or the timer is paused.
  const status = sessionComplete
    ? `${completionHeading} ${roundsText}`
    : !setupComplete
    ? ""
    : isTransitioning
    ? completeText
    : mode === "focus"
    ? `Focus, round ${completedCycles + 1}`
    : MODES[mode].label;
  // First child of both screens' root, so React keeps the same element when the screen switches
  // and the change is announced.
  const announcer = <div className="sr-only" role="status">{status}</div>;

  if (sessionComplete) {
    return (
      <div className="min-h-screen w-full flex flex-col bg-page">
        {announcer}
        <main className="flex-1 w-full flex items-center justify-center p-6">
        <h1 className="sr-only">Violet Tomato – Automatic Pomodoro Focus Timer</h1>
        <div inert={addRoundsModalOpen ? "" : undefined} className="w-full max-w-xs bg-page rounded-2xl border border-subtle p-6 flex flex-col items-center text-center">
          <div className="type-emoji leading-normal" aria-hidden="true">🎉</div>
          <div className="w-full flex flex-col items-center mt-5">
            <h2 ref={completionHeadingRef} tabIndex={-1} className="type-heading text-primary focus:outline-none">{completionHeading}</h2>
            <button
              onClick={() => setSummaryLogOpen((o) => !o)}
              disabled={history.length === 0}
              aria-expanded={history.length > 0 ? summaryLogOpen : undefined}
              aria-controls={history.length > 0 ? "summary-log" : undefined}
              className="w-full flex items-center justify-center gap-1 type-control text-button-tertiary hover:text-button-tertiary-hover disabled:hover:text-button-tertiary disabled:cursor-default h-11 mt-2"
            >
              <span>{roundsText}</span>
              {history.length > 0 &&
                (summaryLogOpen ? (
                  <ChevronUpIcon size={16} />
                ) : (
                  <ChevronDownIcon size={16} />
                ))}
            </button>
            {summaryLogOpen && history.length > 0 && (
              <div id="summary-log" className="mb-3">
                <HistoryLog history={history} />
              </div>
            )}
          </div>
          <button
            onClick={() => {
              setAddRoundsAmount(originalRoundsChoice ?? 4);
              setAddStartsWithBreak(true);
              setAddRoundsModalOpen(true);
            }}
            className="w-full flex items-center justify-center type-control text-button-tertiary hover:text-button-tertiary-hover h-11 mt-1"
          >
            Add more rounds
          </button>
        </div>

        {addRoundsModalOpen && (
          <Dialog title="Add more rounds" onClose={() => setAddRoundsModalOpen(false)}>
            <RoundsStepper label="Number of rounds" value={addRoundsAmount} onChange={setAddRoundsAmount} />
            <RadioGroup
              label="Start with"
              options={START_WITH_OPTIONS}
              value={addStartsWithBreak}
              onChange={setAddStartsWithBreak}
            />
            <RadioGroup
              label="Long break length"
              options={LONG_BREAK_OPTIONS}
              value={longBreakMinutes}
              onChange={setLongBreakMinutes}
            />
            {/* One row (Cancel hugging its text, CTA taking the rest) while both labels fit on one line;
                once they don't, the CTA wraps onto its own line and wrap-reverse puts it above Cancel,
                both full width. The 1 : 999 grow ratio keeps Cancel hugging in the one-row case. */}
            <div className="w-full flex flex-wrap-reverse gap-2">
              <button
                onClick={() => setAddRoundsModalOpen(false)}
                className="grow h-11 px-6 rounded-xl bg-button-secondary type-button text-button-secondary hover:text-button-secondary-hover hover:bg-button-secondary-hover whitespace-nowrap"
              >
                Cancel
              </button>
              <button
                onClick={confirmAddRounds}
                className="grow-[999] h-11 px-6 rounded-xl text-button-primary type-button bg-button-primary hover:bg-button-primary-hover whitespace-nowrap"
                style={{ boxShadow: `0 2px 8px -2px ${MODE_COLORS.focus.shadow}59` }}
              >
                {addRoundsAmount === null
                  ? "Continue without a limit"
                  : addRoundsAmount === 1
                  ? "Add 1 round"
                  : `Add ${addRoundsAmount} rounds`}
              </button>
            </div>
          </Dialog>
        )}
        </main>
        <Credit inert={addRoundsModalOpen} />
      </div>
    );
  }

  return (
    <div className="min-h-screen w-full flex flex-col bg-page" style={{ "--mode-accent": accent, "--mode-accent-hover": MODES[mode].accentHover }}>
      {announcer}
      <div className="flex-1 w-full flex items-start justify-center p-6 pt-16">
      {!setupComplete && (
        <Dialog
          title="Automatic Pomodoro Focus Timer"
          description={
            <>
              Start once: 25&#8209;minute focus rounds and 5&#8209;minute breaks switch automatically, each
              one is logged and ends with a sound alert. Every 4th round gets an optional longer break.
            </>
          }
        >
          <RoundsStepper label="Number of rounds" value={roundsLimit} onChange={setRoundsLimit} />
          <RadioGroup
            label="Long break length"
            options={LONG_BREAK_OPTIONS}
            value={longBreakMinutes}
            onChange={setLongBreakMinutes}
          />
          <button
            onClick={startSession}
            className="w-full h-11 px-6 rounded-xl text-button-primary type-button bg-button-primary hover:bg-button-primary-hover"
            style={{ boxShadow: `0 2px 8px -2px ${MODE_COLORS.focus.shadow}59` }}
          >
            Start
          </button>
        </Dialog>
      )}

      <main inert={!setupComplete ? "" : undefined} className="w-full max-w-sm flex flex-col items-center">
        <h1 className="sr-only">Violet Tomato – Automatic Pomodoro Focus Timer</h1>
        <h2 className="type-mode-label uppercase text-mode">
          {MODES[mode].label}
        </h2>

        <div className={`relative w-72 h-72 mt-6 ${isTransitioning ? "animate-pulse" : ""}`}>
          <svg className="w-full h-full -rotate-90" viewBox="0 0 280 280" aria-hidden="true" focusable="false">
            <defs>
              <radialGradient id="ring-tip-shadow">
                <stop offset="0%" stopColor={shadowColor} stopOpacity="0.25" />
                <stop offset="45%" stopColor={shadowColor} stopOpacity="0.07" />
                <stop offset="100%" stopColor={shadowColor} stopOpacity="0" />
              </radialGradient>
              {/* keeps the shadow inside the ring's band */}
              <clipPath id="ring-band">
                <path
                  clipRule="evenodd"
                  d={`M 140 ${140 - radius - 5} a ${radius + 5} ${radius + 5} 0 1 0 0.01 0 Z
                      M 140 ${140 - radius + 5} a ${radius - 5} ${radius - 5} 0 1 0 0.01 0 Z`}
                />
              </clipPath>
            </defs>
            <circle cx="140" cy="140" r={radius} fill="none" className="stroke-ring-track" strokeWidth="10" />
            <circle
              cx="140" cy="140" r={radius} fill="none" stroke={arcColor} strokeWidth="10"
              strokeLinecap="round" strokeDasharray={circumference} strokeDashoffset={dashoffset}
              style={{ transition: "stroke-dashoffset 1s linear" }}
            />
            {/* Moving end: shadow patch plus a cap drawn on top of it, rotated as one piece so it
                tracks the arc with the same 1s linear easing. */}
            <g
              style={{
                transform: `rotate(${tipDeg}deg)`,
                transformOrigin: "140px 140px",
                transition: "transform 1s linear",
                display: secondsLeft > 0 ? undefined : "none",
              }}
            >
              <circle
                cx={shadowCenter.x} cy={shadowCenter.y} r="8"
                fill="url(#ring-tip-shadow)" clipPath="url(#ring-band)"
              />
              <circle cx={140 + radius} cy="140" r="5" fill={arcColor} />
            </g>
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center">
            {isTransitioning ? (
              <>
                <div className="type-emoji leading-[2.125rem]" aria-hidden="true">{mode === "focus" ? "💪" : mode === "break" ? "🙌" : "🔋"}</div>
                <div className="type-body text-secondary mt-1">{completeText}</div>
              </>
            ) : (
              <>
                <div
                  className="flex items-center justify-center gap-1 h-[1.875rem] mb-3"
                  aria-hidden="true"
                >
                  {Array.isArray(MODES[mode].emoji) ? (
                    MODES[mode].emoji.map((e, i) => (
                      <span key={i} className="type-emoji">{e}</span>
                    ))
                  ) : (
                    <span className="type-emoji">{MODES[mode].emoji}</span>
                  )}
                </div>
                <div className="type-display tabular-nums text-primary">{formatTime(secondsLeft)}</div>
                <div
                  className="flex items-center justify-center type-body text-secondary h-[1.875rem] mt-3"
                >
                  {mode === "focus" ? centerLabel : ""}
                </div>
              </>
            )}
          </div>
        </div>

        <div className="flex items-center gap-5 mt-6">
          <button
            onClick={() => !isTransitioning && handleReset()}
            aria-disabled={isTransitioning || undefined}
            className="flex items-center justify-center rounded-full bg-button-secondary text-button-secondary hover:text-button-secondary-hover hover:bg-button-secondary-hover aria-disabled:opacity-40 aria-disabled:cursor-not-allowed h-11 w-11"
            aria-label="Reset current round"
            title="Reset current round"
          >
            <RotateCcwIcon size={20} />
          </button>
          {(() => {
            const buttonLabel = isTransitioning
              ? preTransitionLabel
              : isRunning
              ? "Pause"
              : secondsLeft === totalSeconds
              ? "Start"
              : "Resume";
            const looksActive = buttonLabel === "Pause";
            return (
              <button
                ref={playPauseRef}
                onClick={() => !isTransitioning && handlePlayPause()}
                aria-disabled={isTransitioning || undefined}
                aria-label={buttonLabel}
                title={buttonLabel}
                className={`flex items-center justify-center h-14 w-14 rounded-full aria-disabled:opacity-40 aria-disabled:cursor-not-allowed ${
                  looksActive ? "bg-button-secondary text-button-secondary hover:text-button-secondary-hover hover:bg-button-secondary-hover" : "bg-button-mode hover:bg-button-mode-hover text-button-primary"
                }`}
                style={looksActive ? undefined : { boxShadow: `0 2px 8px -2px ${shadowColor}59` }}
              >
                {looksActive ? <PauseIcon size={20} /> : <PlayIcon size={20} />}
              </button>
            );
          })()}
          <button
            onClick={() => !isTransitioning && handleSkip()}
            aria-disabled={isTransitioning || undefined}
            className="flex items-center justify-center rounded-full bg-button-secondary text-button-secondary hover:text-button-secondary-hover hover:bg-button-secondary-hover aria-disabled:opacity-40 aria-disabled:cursor-not-allowed h-11 w-11"
            aria-label="Skip"
            title="Skip"
          >
            <SkipForwardIcon size={20} />
          </button>
        </div>

        {/* The first button is the same element in every mode (only its text and action change),
            so keyboard focus stays on it when pressing it switches the mode. aria-disabled instead
            of disabled during the transition, for the same reason. */}
        <div className="flex flex-col items-center mt-6 gap-1">
          <button
            onClick={() => !isTransitioning && (mode === "longBreak" ? switchToShortBreak() : startLongBreak())}
            aria-disabled={isTransitioning || undefined}
            className="flex items-center justify-center type-control text-button-tertiary hover:text-button-tertiary-hover aria-disabled:opacity-40 aria-disabled:cursor-not-allowed h-11"
          >
            {mode === "longBreak" ? "Switch to 5 min break" : mode === "break" ? "Switch to long break" : "Start long break"}
          </button>
          {mode === "longBreak" && (
            <button
              onClick={() => !isTransitioning && addFiveMinutes()}
              aria-disabled={isTransitioning || undefined}
              className="flex items-center justify-center type-control text-button-tertiary hover:text-button-tertiary-hover aria-disabled:opacity-40 aria-disabled:cursor-not-allowed h-11"
            >
              Add another 5 min
            </button>
          )}
        </div>

        <div className="w-full flex flex-col items-center gap-1 mt-6">
          <button
            onClick={() => setLogOpen((o) => !o)}
            aria-expanded={history.length > 0 ? logOpen : undefined}
            aria-controls={history.length > 0 ? "session-log" : undefined}
            className="flex items-center min-h-11 text-button-tertiary hover:text-button-tertiary-hover"
          >
            <span className="flex items-baseline gap-1.5">
              <span className="type-heading text-primary">{completedCycles}</span>
              <span className="type-body text-primary">completed</span>
              {completedCycles > 0 && (
                <span className="self-end py-px">
                  {logOpen ? (
                    <ChevronUpIcon size={16} />
                  ) : (
                    <ChevronDownIcon size={16} />
                  )}
                </span>
              )}
            </span>
          </button>

          {logOpen && history.length > 0 && <div id="session-log"><HistoryLog history={history} /></div>}
        </div>
      </main>
      </div>
      <Credit inert={!setupComplete} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PomodoroTimer />);
</script>
</body>
</html>
